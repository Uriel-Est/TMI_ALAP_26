<script>
(function () {
  function updateAlapNav() {
    if (!window.Reveal) return;

    const current = Reveal.getCurrentSlide();
    const id = current ? current.id : null;

    document.querySelectorAll(".alap-side-nav a").forEach(function (link) {
      link.classList.toggle("active", link.dataset.target === id);
    });
  }

  window.addEventListener("load", function () {
    if (window.Reveal) {
      Reveal.on("ready", updateAlapNav);
      Reveal.on("slidechanged", updateAlapNav);
      updateAlapNav();
    }
  });
})();
</script>

<script>
(function () {
  function activateTab(button) {
    const slide = button.closest("section") || document;
    const group = button.dataset.tabGroup;
    const target = button.dataset.tabTarget;

    if (!group || !target) return;

    slide.querySelectorAll('[data-tab-group="' + group + '"][data-tab-target]').forEach(function (btn) {
      const isActive = btn === button;
      btn.classList.toggle("active", isActive);
      btn.setAttribute("aria-selected", isActive ? "true" : "false");
    });

    slide.querySelectorAll('.tab-panel[data-tab-group="' + group + '"]').forEach(function (panel) {
      const isActive = panel.id === target;
      panel.classList.toggle("active", isActive);
      panel.hidden = !isActive;
    });

    if (window.Reveal) {
      Reveal.layout();
    }
  }

  document.addEventListener("click", function (event) {
    const button = event.target.closest("[data-tab-target]");
    if (!button) return;

    event.preventDefault();
    activateTab(button);
  });

  window.addEventListener("load", function () {
    document.querySelectorAll(".reveal section").forEach(function (slide) {
      const activeButtons = slide.querySelectorAll("[data-tab-target].active");

      activeButtons.forEach(function (button) {
        activateTab(button);
      });
    });
  });
})();
</script>
